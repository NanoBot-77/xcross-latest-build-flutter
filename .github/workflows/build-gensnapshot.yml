name: Build iOS gen_snapshot for Linux

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (leave blank for latest stable)"
        required: false
        type: string
  schedule:
    # Automatically checks for new Flutter releases every 12 hours
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Determine target Flutter version
        id: meta
        run: |
          if [ -n "${{ inputs.flutter_version }}" ]; then
            VERSION="${{ inputs.flutter_version }}"
          else
            VERSION=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
              | jq -r '.releases[] | select(.channel=="stable") | .version' | head -n 1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Skip if a release tag already exists for this Flutter version
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Dart SDK
        if: steps.meta.outputs.exists == 'false'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: Clone xcross_gen_snapshot builder
        if: steps.meta.outputs.exists == 'false'
        run: |
          git clone --depth 1 https://github.com/arxdeus/xcross_gen_snapshot.git builder
          cd builder
          dart pub get

      - name: Resolve & Compile gen_snapshot (Release & Profile)
        if: steps.meta.outputs.exists == 'false'
        run: |
          cd builder
          dart run xcross_gen_snapshot:resolve --flutter "${{ steps.meta.outputs.version }}" > resolve.json
          ENGINE_REV=$(jq -r '.engine' resolve.json)
          DART_REV=$(jq -r '.dart' resolve.json)

          dart run xcross_gen_snapshot:build \
            --engine "$ENGINE_REV" \
            --dart "$DART_REV" \
            --mode release \
            --work work-rel --cache cache --out out-rel

          dart run xcross_gen_snapshot:build \
            --engine "$ENGINE_REV" \
            --dart "$DART_REV" \
            --mode profile \
            --work work-prof --cache cache --out out-prof

      - name: Publish GitHub Release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cp builder/out-rel/gen_snapshot gen_snapshot_release
          cp builder/out-prof/gen_snapshot gen_snapshot_profile

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Flutter $VERSION (linux-x64)" \
            --notes "Automated iOS arm64 gen_snapshot for Flutter $VERSION."

          # Wait briefly for uploads.github.com to register the new release ID
          sleep 5
          for i in 1 2 3; do
            if gh release upload "$VERSION" \
              gen_snapshot_release \
              gen_snapshot_profile \
              --clobber \
              --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "Upload attempt $i failed, retrying in 5s..."
            sleep 5
          done
          exit 1